<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Colab Bridge</title>
<style>
body{font-family:sans-serif;text-align:center;padding:50px;background:#1a1a2e;color:#eee}
a{color:#0ff;font-size:1.2em}
.box{max-width:600px;margin:0 auto;background:#16213e;padding:30px;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h1>🖥️ Colab Bridge</h1>
<p>Redirecting to current Colab session...</p>
<div id="status">Loading...</div>
</div>
<script>
fetch("urls.json")
.then(r=>r.json())
.then(data=>{
  document.getElementById("status").innerHTML =
    "<h3>API</h3><a href=\""+data.api_url+"\" target=\"_blank\">"+data.api_url+"</a>" +
    "<h3>Desktop</h3><a href=\""+data.novnc_url+"\" target=\"_blank\">"+data.novnc_url+"</a>" +
    "<p>Token: "+data.token+"</p><p>VNC Pass: "+data.vnc_pass+"</p>" +
    "<p>Updated: "+data.updated+"</p>";
})
.catch(e=>{
  document.getElementById("status").innerHTML="<p style=\"color:#f44\">Colab not running. Start the notebook first.</p>";
});
</script>
</body>
</html>
